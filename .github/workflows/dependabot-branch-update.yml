name: Dependabot branch auto-update

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update stale Dependabot PR branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --repo "$REPO" --author "app/dependabot" --state open --json number,mergeStateStatus -q '.[] | select(.mergeStateStatus == "BEHIND") | .number')
          for pr in $prs; do
            echo "Updating PR #$pr"
            gh pr update-branch "$pr" --repo "$REPO" || true
          done
