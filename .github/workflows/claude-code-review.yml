name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  claude-review:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.title, 'chore(deps')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read CLAUDE.md, then review this PR for must-fix issues only:
            - Bugs or logic errors, including in workflows
            - Security issues: secret exposure (public repo), XSS via dangerouslySetInnerHTML outside JSON-LD, overly-broad GH Actions permissions
            - Violations of CLAUDE.md's invariants: Link/useRouter/usePathname/redirect not from @/i18n/navigation, keys missing from messages/en.json or messages/fi.json, hardcoded user-facing strings, static metadata instead of generateMetadata, missing setRequestLocale
            - Broken or unsafe deploy, migration or rollback logic

            Skip anything CI already enforces (ESLint, tsc, Vitest, Playwright) and skip style, subjective, or hypothetical feedback.

            Post inline comments for must-fix issues, then one top-level summary — explicitly say "looks good" if there are none. Don't manufacture issues to appear thorough.
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
